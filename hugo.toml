# 站点基础信息
baseURL = "https://tsugihagidake.github.io/"
languageCode = "zh-CN"
defaultContentLanguage = "zh"
hasCJKLanguage = true
title = "出口は直ぐ其処"
theme = "hugo-theme-stack"
enableRobotsTXT = true
enableEmoji = true

[pagination]
pagerSize = 5

[permalinks]
page = "/:slug/"

# 左侧主导航
[menu]
[[menu.main]]
identifier = "home"
name = "首页"
url = "/"
weight = 1

[menu.main.params]
icon = "home"

[[menu.main]]
identifier = "categories"
name = "分类集"
url = "/categories/"
weight = 2

[menu.main.params]
icon = "categories"

# 头像下方的社交链接
[[menu.social]]
identifier = "github"
name = "GitHub"
url = "https://github.com/tsugihagidake"
weight = 1

[menu.social.params]
icon = "brand-github"
newTab = true

[params]
mainSections = ["post"]
rssFullContent = true
# 用于搜索引擎和分享卡片；侧栏可见文字请修改 sidebar.subtitle。
description = "You found me"

[params.sidebar]
compact = false
emoji = "🤔"
subtitle = "在世界尽头呼唤……我自己？！"
avatar = "https://avatars.githubusercontent.com/tsugihagidake"

[params.colorScheme]
toggle = true
default = "auto"

[params.article]
headingAnchor = false
toc = true
readingTime = true

[params.article.list]
showTags = false

# 右侧栏：主页显示搜索与分类，文章页显示目录。
[params.widgets]
homepage = [
    { type = "search" },
    { type = "categories", params = { limit = 10 } },
]
page = [{ type = "toc" }]

[params.footer]
since = 2026
customText = ""

# 尚未配置评论服务时保持关闭，避免生成无效评论区。
[params.comments]
enabled = false
